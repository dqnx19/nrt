<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <style>
        .details-panel {
            background-color: #f8fafc;
            color: #1e293b;
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .details-panel .detail {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: 400;
            line-height: 1.4;
        }

        .details-panel .detail img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .details-panel .detail span {
            font-weight: 600;
        }

        @media (prefers-color-scheme: dark) {
            .details-panel {
                background-color: #12315a;
                color: #f1f5ff;
            }

            .details-panel .detail img {
                filter: invert(1);
            }
        }
    </style>
</head>

<body>
    <script src="pages.js" defer type="module"></script>
</body>

</html>
